<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rexon</title>
<!-- Rexon screensaver for the Steam Big Picture idle screen.
     The picture set and the settings are put next to it by Rexon (manifest.js); without it
     the page shows the bouncing Rexon logo. Everything is local, no network. -->
<link rel="stylesheet" href="screensaver.css">
</head>
<body>
<div id="stage">
  <div class="slide" id="slideA"><div class="pan"></div><div class="front"></div><div class="caption"></div></div>
  <div class="slide" id="slideB"><div class="pan"></div><div class="front"></div><div class="caption"></div></div>
  <img id="bouncer" alt="" draggable="false">
</div>
<div id="clock"><div class="time"></div><div class="date"></div></div>
<script src="manifest.js"></script>
<script src="screensaver.js"></script>
</body>
</html>
