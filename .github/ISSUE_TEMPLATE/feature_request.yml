name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do
      description: Describe the task or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: input
    id: system
    attributes:
      label: Distribution and desktop it is about
      placeholder: Fedora 43, GNOME
