[package]
name = "rexon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rexon core (без Qt): DE-логика, парсеры, API-клиенты, настройки"

# ── Marking the checks that need a live machine BY THEIR NATURE ──────
#
# WHY. Almost all core checks must give one answer anywhere: they
# read fixtures and stand-in trees. But a handful check the work with
# the REAL system itself — looking up binaries in the live PATH the same way
# `shutil.which` did; building the translation catalog with the real `lrelease`;
# the liveness of generator references in the git object database. They cannot be thrown out:
# they are exactly what catches what no fixture will. But their red must not
# be confused with a real breakage either — on a machine without `lrelease` or with someone else's
# PATH they go red without anything being broken.
#
# WHY A BUILD FEATURE AND NOT AN ENVIRONMENT VARIABLE. `cargo test` does not have
# our run with a list of skipped checks (like the former `rexon-bridge-tests
# --isolated`). An environment variable would give an early `return` inside the check —
# libtest would count it as GREEN and inflate the count out of nothing; exactly this
# mistake was already caught in the bridge (`REXON_NOT_A_CHECK`, commit c7d5687). A build
# feature turns on the stock `#[ignore = "…"]`, and libtest itself prints
# `ignored` with the reason and a separate line in the summary — the very «named on a
# separate line», only without our own run.
#
# HOW TO USE:
#   cargo test-core            — as before, everything together (the development machine);
#   cargo test-core-isolated   — without the checks that depend on the machine.
# A separate set of files for them is deliberately not created: a check must
# lie next to its module kin, otherwise it gets lost during edits.
[features]
isolated-checks = []
# The session rights helper stand («one password», level 2 of three): builds the binary
# `rexon-priv-stand` (a «dry» RootIo, a root prefix, fake logind and
# clock) and its test `priv_stand`. ⛔ Only for the stand: the package and `build-app`
# do not enable the feature, the library and the real `rexon-priv-helper` do not
# change because of it (the stand code is only in `src/bin/rexon-priv-stand.rs`).
# Run — `scripts/priv-stand`, description — docs/testing.md.
stand = []

[[bin]]
name = "rexon-priv-stand"
path = "src/bin/rexon-priv-stand.rs"
required-features = ["stand"]

[[test]]
name = "priv_stand"
path = "tests/priv_stand.rs"
required-features = ["stand"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order — an IndexMap inside Value: key order as in a Python dict,
# needed for a byte-for-byte check of the output against json.dump.
serde_json = { version = "1", features = ["preserve_order"] }
# zip — packing/unpacking .rxn (a port of extensions/utils.py, manifest_v4.py).
# Deflate only: ZIP_DEFLATED in Python; extra codecs (zstd/lzma/bzip2) are not
# needed — we keep the dependency tree smaller.
zip = { version = "2", default-features = false, features = ["deflate"] }
# prost — protobuf structures of the waywallen daemon protocol (control.proto/
# filter.proto). The code is generated by prost-build in build.rs from .proto (not written
# by hand). A port of control_pb2.py/filter_pb2.py.
prost = "0.13"
# quick-xml — parsing XML replies of the OCS API (a port of appearance/ocs_client.py, where
# Python uses xml.etree.ElementTree). Reading only; default features
# (no serde/async) — a minimal dependency tree.
quick-xml = "0.39"
# sha2 — SHA-256 for content hashes (Axon extraction, Conky checks, importers,
# QML module cache, SteamOS sysext and others).
sha2 = "0.10"
# toml — parsing `plugin.toml` of waywallen plugins (a port of engine_update.py, where
# Python uses the stdlib tomllib). Parsing only (no display/serde-derive):
# we read `[plugin] id/name/version` of the manifest of an installed/downloaded plugin.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# ureq — the synchronous HTTP client of the theme catalog network layer (a port of
# `_http_get`/`_http_download` from appearance/ocs_client.py and `_http_json` from
# appearance/aur_client.py, where Python uses the stdlib urllib). A SYNCHRONOUS
# client was chosen: the calls come from worker threads (today a Python QThread,
# tomorrow a worker thread of the Qt layer), an async runtime (tokio in reqwest) is not
# needed there and would be extra weight and an extra dependency tree.
# Version 3.x (was 2.12) — for CANCELLING an already sent request: 3.x has
# a replaceable connection layer (`unversioned::transport`), and our link is built into it,
# which splits the wait for the reply and breaks it on an external signal
# (see net.rs, CancelToken). 2.x has no such seam at all — there a request can
# only be waited out. ⚠️ The `unversioned` module is deliberately outside semver: check a
# ureq update with the `net_cancel.rs` tests, not by the major number.
# TLS — `native-tls`, i.e. the system OpenSSL and the system trust store.
# The roots are set explicitly in net.rs (`RootCerts::PlatformVerifier`), rustls is not
# enabled.
# Licenses: ureq, ureq-proto, http, native-tls, der, rustls-pki-types —
# MIT/Apache-2.0, permissive (rule #10).
# ⚠️ A divergence from the former decision, a conscious one: in ureq 3 ALL the native-tls code
# is behind the `native-tls` feature, and it pulls in a crate with a snapshot of root
# authorities (`webpki-root-certs`). Previously such a crate was rejected as MPL-2.0 —
# today it is under CDLA-Permissive-2.0 (checked in the registry on 2026-07-31), i.e.
# permissive, and it does not contradict rule #10. We still do NOT use its data:
# the configuration forces the system store, not the Mozilla list.
# The trimmed `native-tls-no-default` feature does not fit — it adds
# dependencies but does not enable the TLS code itself, and any https panics with
# «feature is not enabled» (checked live).
# The upside of system roots: the list is updated by the distribution, not by our release, and
# corporate CAs just work.
# ⚠️ THE PRICE OF THE DECISION (keep in mind when packaging): the production binary now links
# DYNAMICALLY against the system libssl/libcrypto instead of carrying TLS inside. So
# the delivery (Flatpak for SteamOS, distribution packages) must include
# OpenSSL 3 and the `ca-certificates` store. Because of this the bridge wheel requires
# `patchelf` in the maturin build and weighs 7.4 MB instead of 2.9 MB — it embeds
# six system `.so` files inside itself.
# The gzip feature is NOT enabled: urllib does not send `Accept-Encoding` and does not unpack
# the reply — an enabled decompression would diverge from the original.
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }
# flate2 — unpacking ONE compressed reply: the Cinnamon Spices theme repository tree
# from GitHub (`cinnamon_spices::THEME_TREE_URL`, ~9 MB as is, ~1.2 MB
# compressed). The shared network layer is still without gzip (see above); compression
# is requested only by this request. The crate and the engine are the same ones `zip` already pulls in
# (miniz_oxide) — no new dependencies. MIT/Apache-2.0.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# ── extracting the personal webapi_token from the Steam client's cookie ──
# A port of the deterministic part of the Python code (archive, git tag `python-final`; decrypting
# steamLoginSecure from the CEF DB): sqlite + the Chromium v10 scheme (AES-128-CBC,
# a PBKDF2-HMAC-SHA1 key). See src/steam_token.rs.
# All crates are MIT/Apache-2.0 (rule #10), SQLite itself is public domain.
#
# rusqlite (bundled) — reading the `cookies` table of the CEF DB. `bundled` compiles
# SQLite right into the tree: we do not depend on the version of the system libsqlite3 and read
# the DB deterministically. Licenses: rusqlite/libsqlite3-sys — MIT, SQLite itself —
# public domain. We open it read-only (see the module).
rusqlite = { version = "0.32", features = ["bundled"] }
# aes + cbc — AES-128 in CBC mode with PKCS7 unpadding (Chromium v10). RustCrypto,
# MIT/Apache-2.0. The block-padding feature is needed for `decrypt_padded_mut::<Pkcs7>`.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
# pbkdf2 + sha1 — deriving the 16-byte key: PBKDF2-HMAC-SHA1, pw="peanuts",
# salt="saltysalt", iter=1 (the Chromium Linux fallback). RustCrypto, MIT/Apache-2.0.
# sha1 here is exactly the hash for PBKDF2 (not sha2, which is already in the tree).
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
# hmac — the password of the downloaded Razer Axon wallpaper file (HMAC-SHA256,
# `axon_extract.rs`). The same version that pbkdf2 already pulls in: no new crates.
hmac = "0.12"

# libc — exactly one call: `kill(pid, SIGTERM)` to the audio capture subprocess
# (audio_capture.rs). std has only `Child::kill()` = SIGKILL, while the original
# in Python stopped `pw-record`/`parec`/`arecord` with a gentle `terminate()`,
# letting them detach from the PipeWire graph. The crate is already in the build tree
# (transitively through zip/ureq/pyo3) and is declared as a direct dependency of
# rexon-splash-overlay; the MIT/Apache-2.0 license is permissive, rule #10.
#
# ⚠️ Since 2026-09-08 there is more than one call: the live executor of the login
# video splash moved here (`splash_exec.rs`), and it needs unix sockets for mpv IPC and
# sd_notify (std cannot do an address in the abstract namespace), the flock of the «one
# run per session» lock, the wake-up pipe of the raise loop and poll on the descriptor
# of the X connection.
libc = "0.2"

# zbus — ONE D-Bus call: `performAction` of Plasma Login Manager's own
# helper (KAuth, the system bus), so that the background and the carry-over of the login screen
# look are written by its helper, not by us (`plasma_login.rs`; writing it ourselves
# is the path on which PLM got CVE-2026-25710). The synchronous API
# (`blocking-api`) on the built-in `async-io` executor: the call comes from a
# worker thread, we do not pull tokio into the core. Passing the picture's descriptor
# (`a{sh}`) is standard in zbus on unix. The MIT license is permissive, rule #10.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# ── the live executor of the login video splash (splash_exec.rs) ─────
# Both crates came TOGETHER with the module from rexon-py and appeared in the core tree on
# 2026-09-08: without them the Rust «Steam» tab could neither play
# a clip nor enable autostart, and there must be no second copy of the executor
# (rule #12).
#
# x11-dl — the splash's own X11 layer (an override-redirect window over the whole
# screen, the poster as a background, an event-driven raise loop). The crate loads libX11 through
# dlopen AT CALL TIME and honestly returns an error if it is missing: on a
# Wayland machine without libX11 the core still builds and works, and the splash
# goes its own way. The core does not link against libX11.
# License: CC0-1.0 (permissive, rule #10).
x11-dl = "2.21"
# image — the poster (the first frame of the clip) as the background of the X11 layer: parsing the PNG from ffmpeg and
# fitting it to the screen with Lanczos, as Pillow did. png — for the splash; jpeg and
# webp — for blurring the wallpaper (`wallpaper_engine::blur_image_file`): picture wallpapers
# come as JPEG/WebP, and the blurred copy is written as JPEG. gif — for reading GIF
# frames for Steam profile showcases (`steam_showcase`). Other codecs are not
# needed — the dependency tree stays small.
# License: MIT OR Apache-2.0.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# gif and color_quant — cutting GIFs for Steam profile showcases
# (`steam_showcase`): our own shared palette with the needed number of colors, to
# fit a part into 5 MB. Both are already in the dependency tree (through image and
# ruffle_render), no new crates arrive.
# Licenses: gif — MIT OR Apache-2.0; color_quant — MIT.
gif = "0.14"
color_quant = "1.1"
# png and md-5 — thumbnails of wallpaper cards without a ready preview
# (`we_thumbnail`): a PNG with the `Thumb::URI`/`Thumb::MTime`/`Thumb::Size` tags
# (the `image` encoder does not write tags) and the file name in the shared thumbnail cache —
# the md5 of the address, as the freedesktop standard prescribes. png is already in the tree through image.
# Licenses: both MIT OR Apache-2.0.
png = "0.18"
md-5 = "0.10"

# ── the auto-translation engine for appearance descriptions ──────────
# fxtranslate — a Rust implementation of the Firefox translation engine. Vendored into
# the tree (`rust/vendor/fxtranslate/`) rather than taken as a crates.io dependency,
# because we PATCH it: without our CPUID-based choice of instruction set the
# product crashes with SIGILL on any x86-64 without AVX2, and it crashes not at start
# but AFTER the model is loaded, on the first translation. Rebuilding the vendor —
# `scripts/sync-fxtranslate.py`, our edits as one file —
# `rust/vendor/fxtranslate/patches/`, the MPL-2.0 obligations —
# `rust/vendor/fxtranslate/ATTRIBUTION.md`.
#
# THE FEATURE SET is exactly the one the measurements below were taken on: `default` (= `fast` = lean-embed +
# gemmology + mmap) plus `threads` (batch translation across cores).
#   ⛔ do NOT enable `gemm-threads`: on 4 data threads it crashes with SIGSEGV
#     (8 attempts out of 8), on one it gives 1.17× at the cost of four cores and on top of that
#     CHANGES the translation against the same binary without the pool.
#   ⛔ do NOT enable `download`/`net`/`discovery`: they pull in ureq + rustls, and
#     their loader (`remote::pick`) takes the highest version of a record without looking
#     at the architecture — i.e. it downloads the ANDROID `base-memory` instead of
#     the desktop `base` (0.34 chrF++ worse). The model is nailed down
#     in the delivery, we do not go to the network on the buyer's machine.
#   ⛔ `icu-segmenter` is not enabled for now: the segmenter changes the split into
#     sentences, and therefore the output — the choice of segmenter is decided together
#     with embedding into the window, not here.
# License: MPL-2.0 (a per-file copyleft — it covers the files of the crate ITSELF
# that we changed, not the Rexon code that links with it).
fxtranslate = { path = "../vendor/fxtranslate/crate", features = ["threads"] }

[build-dependencies]
# prost-build generates Rust structures from .proto at build time (protoc is needed
# in PATH). The only source of .proto is the original in data/qt_wallpaper_engine/
# proto/, we read it directly (we do not copy it, so as not to diverge from upstream).
prost-build = "0.13"
# prost + prost-types in the build script — parsing the FileDescriptorSet that
# protoc returns together with the structures: the table of field numbers of
# `oneof payload` of the Request message is generated from it (see build.rs for why not by hand).
# They add no new dependencies: both are already pulled in by prost-build.
prost = "0.13"
prost-types = "0.13"
