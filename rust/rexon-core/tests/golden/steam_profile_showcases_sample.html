<!DOCTYPE html>
<html class=" responsive DesktopUI" lang="en">
<head><title>Steam Community :: SamplePlayer</title></head>
<body class="flat_page profile_page has_profile_background DefaultTheme responsive_page " >
<!-- Образец разметки публичного профиля Steam (снят 12.10.2026, разметка
     сохранена как есть, имена, номера и адреса картинок заменены
     вымышленными). Три витрины подряд: достижения, снимки экрана,
     иллюстрации. -->
<div class="no_header profile_page has_profile_background  "
	 style="background-image: url( 'https://shared.fastly.steamstatic.com/community_assets/images/items/100/0000000000000000000000000000000000000000.jpg' );">
			<div class="profile_leftcol">

									<div class="profile_customization_area">
												<div class="profile_customization">
		<div class="profile_customization_header">Rarest Achievement Showcase</div>
	<div class="profile_customization_block">
		<div class="achievement_showcase">
			<div class="showcase_content_bg showcase_stats_row">
			</div>
		</div>
	</div>
</div>
<div class="profile_customization myscreenshots">
		<div class="profile_customization_header">Screenshot Showcase</div>

	<div class="profile_customization_block">
		<div class="screenshot_showcase">
						<div class="screenshot_showcase_primary showcase_slot " >
									<a class="screenshot_showcase_screenshot modalContentLink ugc" data-appid="20900" data-publishedfileid="100000001" href="https://steamcommunity.com/sharedfiles/filedetails/?id=100000001">
						<img width="100%" style="max-width: 506px;" src="https://images.steamusercontent.com/ugc/100000000000000001/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA1/?imw=506&imh=316&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true">
					</a>
					<div class="screenshot_showcase_itemname">
						First screenshot					</div>
					<div class="screenshot_showcase_stats">
													<span class="screenshot_showcase_stat" title="Up Votes">
								<img class="screenshot_showcase_staticon" src="https://community.fastly.steamstatic.com/public/images/sharedfiles/icons/icon_rate.png"> 3							</span>
											</div>
											</div>
			<div class="screenshot_showcase_rightcol">
									<div class="screenshot_showcase_smallscreenshot showcase_slot " >
						<a class="screenshot_showcase_screenshot modalContentLink ugc" href="https://steamcommunity.com/sharedfiles/filedetails/?id=100000002" data-appid="20900" data-publishedfileid="100000002">
							<img width="100%" style="max-width: 100px;" src="https://images.steamusercontent.com/ugc/100000000000000002/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA2/?imw=100&imh=62&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true">
						</a>
					</div>

							<img width="100%" style="max-width: 100px;" src="https://images.steamusercontent.com/ugc/100000000000000003/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA3/?imw=100&imh=62&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true">
						</a>
					</div>
													<a class="screenshot_showcase_smallscreenshot screenshot_count" href="https://steamcommunity.com/id/SamplePlayer/screenshots/">
						<div class="screenshot_showcase_screenshot">
							+ 29						</div>
					</a>
							</div>
			<div style="clear: both;"></div>
		</div>
	</div>
</div>

		<div class="profile_customization_header">Artwork Showcase</div>
	<div class="profile_customization_block">
		<div class="screenshot_showcase">
						<div class="screenshot_showcase_primary showcase_slot " >
