# rexon-qt-filter — the filter editor model of the WE tab in Rust/cxx-qt
# (a port of waywallen ui/src/model/filter_rule_model.cpp, MIT — attribution in
# NOTICE). Built as a cdylib, loaded into Python through ctypes; the former
# intermediate C++ copy was removed on 2026-07-27, this is the only model.
# A separate crate — rexon-core is NOT touched (there is no Qt there).
[package]
name = "rexon-qt-filter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.9"
