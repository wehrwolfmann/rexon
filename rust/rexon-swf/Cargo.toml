# rexon-swf — Flash wallpapers (SWF) without Qt: Ruffle draws through wgpu (Vulkan) into the
# host window by raw handle or into an mmap frame for the GNOME/Cinnamon shell extension.
# Placing the window (LayerShellQt, xprop), parsing REXON_WP_* and the generation counter
# path are the job of the host (`rexon-gui`, the `rexon-wallpaper-host --mode swf` mode)
# and of the core (`rexon-core::wallpaper_mmap`); here there is only drawing, pacing, pause, sound.
#
# The license is Apache-2.0, as for all of Rexon (owner's decision of 02.10.2026).
[package]
name = "rexon-swf"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Flash-обои Rexon: Ruffle + wgpu без Qt"

[features]
default = []
# Ruffle sound through cpal (ALSA). Off in the default build and at
# run time (`Settings::audio_volume = None`). symphonia (MPL-2.0) is not pulled in:
# only the `ruffle_core/audio` mixer (PCM/ADPCM) is enabled, without mp3/aac.
sound = ["dep:cpal", "ruffle_core/audio"]

[dependencies]
# Ruffle — a git dependency on a pinned revision (it is not on crates.io).
# The Ruffle license is MIT OR Apache-2.0. The `default_font` feature embeds
# a subset of the Noto Sans font (SIL OFL-1.1): the font's license text goes
# into the delivery (packaging/aur/PKGBUILD).
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", rev = "9525d0fb8773a0d1868940918385e66360927a07", features = ["default_font"] }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle", rev = "9525d0fb8773a0d1868940918385e66360927a07" }
futures = "0.3"
ash = "0.38"
libc = "0.2"
# The shared Rexon journal (`applog`): sound lines go to the same file as the
# wallpaper host lines (`rexon-wallpaper-host --mode swf`). The core without Qt.
rexon-core = { path = "../rexon-core" }
raw-window-handle = "0.6"
cpal = { version = "0.17", optional = true }
