# rexon-splash-overlay — playing video on the very top layer
# (wlr-layer-shell OVERLAY) in a KWin Wayland session (Plasma 6).
#
# A reusable component of the Rexon login splash: draws video over the whole
# screen through the embedded libmpv (render API, OpenGL/GLES2) on an EGL surface of a
# wl_egl_window. An external controller drives the player over the ordinary
# mpv JSON IPC (--ipc). The process keeps the last frame until SIGTERM or the
# «quit» command over IPC — exactly like a standalone mpv, which the splash
# orchestrator uses now.

[package]
name = "rexon-splash-overlay"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[[bin]]
name = "rexon-splash-overlay"
path = "src/main.rs"

[dependencies]
# Layer shell, registry, output, compositor; re-exports wayland-client.
smithay-client-toolkit = "0.19"
# WlEglSurface → *mut wl_egl_window (the native window for EGL).
wayland-egl = "0.32"
# Links libEGL, provides the EGL 1.4/1.5 API.
khronos-egl = { version = "6", features = ["static"] }
# eventfd/poll/signal.
libc = "0.2"
# The shared Rexon journal (`applog`): splash lines go to the same file as the
# window lines, with the same rotation. The core without Qt — it brings no Qt to the splash.
rexon-core = { path = "../rexon-core" }
