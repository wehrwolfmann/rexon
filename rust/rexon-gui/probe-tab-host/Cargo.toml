# rexon-tab-host-probe — МАКЕТ каркаса главного окна.
#
# Не продуктовый крейт и не часть рабочего пространства: стенд разведки перед
# переносом `rexon/qt_main/` на QML. Отвечает ровно на один вопрос, который
# нельзя решить чтением наших исходников: в какую сторону Qt 6 умеет
# СМЕШИВАТЬ QtWidgets и Qt Quick. От ответа зависит порядок работ —
# переносить каркас окна первым или последним.
#
# Меряется в живом сеансе, на настоящем Qt 6.11 и настоящем композиторе:
#   * загрузка QML внутрь страницы QTabWidget (QQuickWidget) — по пикселям;
#   * переход клавиатурного фокуса из виджета в QML и обратно;
#   * попытка обратного вложения: QWidget внутрь сцены Qt Quick.
#
# Почему отдельный крейт, а не бинарь внутри rexon-gui: продуктовому крейту
# пришлось бы дописать в build.rs модули Widgets и QuickWidgets, а этот файл
# общий — его правят параллельно другие партии. Свой `[workspace]` ниже
# отвязывает макет от рабочего пространства: `cargo build` в rust/ его не
# видит и не ломает.
#
# Куда он денется: живёт до конца переноса каркаса на QML — им же проверяется,
# что смешанное окно (часть вкладок QML, часть виджеты) остаётся исправным.
# После того как виджетных вкладок не останется, каталог удаляется целиком.
[package]
name = "rexon-tab-host-probe"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Макет: направление вложения QtWidgets ↔ QML в Qt 6"

# Собственный корень рабочего пространства — крейт намеренно вне rust/Cargo.toml.
[workspace]

[dependencies]

[build-dependencies]
# Только компиляция одного .cpp и поиск Qt через pkg-config. Ни cxx-qt, ни
# moc здесь не нужны: в макете нет ни одного Q_OBJECT — сигналы ловятся
# лямбдами, а типы QML не регистрируются.
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "tab-host-probe"
path = "src/main.rs"
