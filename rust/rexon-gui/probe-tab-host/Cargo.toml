# rexon-tab-host-probe — a MOCK-UP of the main window frame.
#
# Not a product crate and not part of the workspace: a reconnaissance stand before
# moving `rexon/qt_main/` to QML. It answers exactly one question that
# cannot be settled by reading our sources: in which direction Qt 6 can
# MIX QtWidgets and Qt Quick. The order of work depends on the answer —
# move the window frame first or last.
#
# Measured in a live session, on the real Qt 6.11 and a real compositor:
#   * loading QML inside a QTabWidget page (QQuickWidget) — by pixels;
#   * moving keyboard focus from a widget into QML and back;
#   * an attempt at the reverse nesting: a QWidget inside a Qt Quick scene.
#
# Why a separate crate and not a binary inside rexon-gui: the product crate
# would have to add the Widgets and QuickWidgets modules to build.rs, and that file
# is shared — other batches edit it in parallel. Its own `[workspace]` below
# detaches the mock-up from the workspace: `cargo build` in rust/ does not
# see it and does not break it.
#
# Where it will go: it lives until the frame is moved to QML — it also checks
# that a mixed window (some tabs QML, some widgets) stays working.
# Once no widget tabs remain, the directory is removed entirely.
[package]
name = "rexon-tab-host-probe"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Макет: направление вложения QtWidgets ↔ QML в Qt 6"

# Its own workspace root — the crate is deliberately outside rust/Cargo.toml.
[workspace]

[dependencies]

[build-dependencies]
# Only compiling one .cpp and finding Qt through pkg-config. Neither cxx-qt nor
# moc is needed here: the mock-up has not a single Q_OBJECT — signals are caught
# with lambdas, and no QML types are registered.
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "tab-host-probe"
path = "src/main.rs"
