# Псевдонимы сборки Rexon.
#
# ЗАЧЕМ. В `Cargo.toml` стоит `default-members = ["rexon-core"]` —
# намеренно, чтобы голый `cargo test` ядра не тянул за собой Qt6
# (rexon-gui, rexon-qt-filter на cxx-qt).
# Плата за это — ловушка: голый `cargo build --release` рапортует
# «Finished» за секунды, собрав ОДНО ядро, а окно `rexon-main-window` с
# вкладками на QML остаётся старым. Человек
# уверен, что собрал сегодняшний день, а меряет позавчерашний. Наступили
# на это 2026-08-29: «сборка прошла успешно», .so двухдневной давности.
# Замер после правки исходника вкладки: `cargo build --release` — «Finished
# in 0.05s», .so не тронута; `cargo build-app` — 1 мин 45 с, .so свежая.
#
# Ловушку убираем не отменой `default-members` (ядро потеряло бы
# независимость от Qt), а именованными командами: у каждой свой
# честный набор пакетов, и ни одна не собирает меньше, чем обещает.
# Список видно без чтения этого файла — `cargo --list` печатает псевдонимы
# вместе с разворотом.
#
# ⚠️ Псевдонимы читаются по ТЕКУЩЕМУ каталогу, а не по `--manifest-path`:
# работают, когда cargo запущен из `rust/` или изнутри крейта. Из корня
# репозитория (`cargo build --manifest-path rust/Cargo.toml`) этого файла
# cargo не увидит — там набор пакетов пишем через `-p` руками.
#
# Моста в Python больше нет: rexon-py ушёл в архив (_archived/, 02.10.2026).

[alias]
# Приложение целиком: ядро + `rexon-main-window` (вкладки на QML) +
# `librexon_qt_filter.so` (модель редактора фильтров). Это то, что грузит
# живой Rexon, и то, что обязано быть свежим перед ЛЮБЫМ замером UI.
# Требует Qt6. Команда «собрать проект» — она, а НЕ голый `cargo build`.
build-app = "build --release -p rexon-core -p rexon-gui -p rexon-qt-filter"

# То же в debug — для отладочных прогонов вкладок. ⚠️ release и debug живут
# в разных каталогах target: собрал debug — release осталась старой.
build-app-debug = "build -p rexon-core -p rexon-gui -p rexon-qt-filter"

# Бинарь заставки входа. ОТДЕЛЬНОЙ командой, и это не небрежность:
# rexon-splash-overlay тянет свой стек (wayland/EGL), и когда он попадает в
# ОДИН прогон cargo вместе с rexon-gui, объединение фич общих зависимостей
# (libc, rustix, bitflags, log…) меняется — rexon-gui пересобирается
# целиком. Замерено: чередование «всё одним прогоном» и `build-app` жгло по
# 1 мин 40 с на ровном месте. Разными прогонами — 0,1 с, набор фич каждой
# команды стабилен. Заставка правится редко, вкладки — каждый день.
build-splash = "build --release -p rexon-splash-overlay"

# Тесты ядра: явное имя того, что делает голый `cargo test`, — без Qt и без
# Python. Ради этой независимости default-members и сужен до rexon-core.
test-core = "test -p rexon-core"

# То же без сверок, которым нужна ЖИВАЯ машина (живой PATH, `lrelease`,
# объектная база git): они помечены `#[cfg_attr(feature = "isolated-checks",
# ignore = "…")]` и libtest напечатает их отдельной строкой «ignored» с
# причиной, а не молча зачтёт зелёными. Зачем именно признак сборки —
# в `rexon-core/Cargo.toml`, раздел `[features]`.
# ⚠️ Переключение фичи пересобирает набор сверок (другой cfg) — это минуты,
# а не секунды; для обычной работы нужен `test-core`.
test-core-isolated = "test -p rexon-core --features isolated-checks"

# ── Сборка движка перевода: четыре ядра в файле, выбор по CPUID ──────
#
# ЗАЧЕМ. Вендорный `fxtranslate` (rust/vendor/fxtranslate/) умеет собирать
# своё ядро умножения матриц ПОД НЕСКОЛЬКО наборов инструкций сразу —
# avx2, avxvnni, avx512bw, avx512vnni — и выбирать набор один раз при
# первом обращении по флагам процессора (`is_x86_feature_detected!`). Это
# наша правка, её нет у апстрима: в 0.4.2 набор прибивается НА СБОРКЕ
# (`-mavx2` в их build.rs) и проверки CPUID нет нигде.
#
# ЧЕМ ГРОЗИТ ЗАБЫТЬ. Собранное под один набор ядро на процессоре без него
# даёт SIGILL, причём не на старте: замер стенда — «загрузка модели:
# 0.031 с», окно уже показано, и код возврата 132 = 128 + 4 на ПЕРВОМ
# умножении матриц. То есть покупатель со старым процессором (Intel до
# Haswell, AMD до Zen, младшие Celeron/Pentium/Atom) увидит рухнувшую
# программу на первом переводе описания. Поэтому переменная стоит здесь, в
# конфиге мастерской, а не в памяти человека, который собирает.
#
# ЦЕНА. Четыре копии ядра в одном файле — 10–20 КБ (0,90 против 0,89 МБ):
# ядро это компактный шаблонный код, вся модель лежит во внешнем файле.
# Многоарочная сборка идёт ровно как выделенная VNNI-сборка (0,071 против
# 0,069 с на абзаце — шум). `-C target-cpu=native` не ставим намеренно: он
# привязал бы сборку к машине разработчика, а выигрыш его правка
# округления активаций в вендоре уже забрала.
#
# REQUIRE_SIMD. Второй гвоздь: без него крейт при неудаче сборки шима
# МОЛЧА уходит на скалярное ядро — это в 9 раз медленнее, и заметить
# подмену можно только замером. Пусть лучше сборка честно встанет.
#
# ⚠️ Читается по ТЕКУЩЕМУ каталогу, как и псевдонимы выше: работает из
# `rust/` и изнутри крейтов. Собирая из корня репозитория
# (`--manifest-path rust/Cargo.toml`), обе переменные надо задать руками —
# иначе получится одноарочная сборка под AVX2.
# ⚠️ Многоарочная ветка требует GNU binutils (`objcopy --localize-hidden`,
# `ar`) и написана под x86-64; aarch64 идёт прежним одноарочным путём
# (i8mm), MSVC не поддержан.
# Приоритет у окружения (force не ставим): `FXT_GEMM_X86_MULTI=0 cargo …`
# вернёт одноарочную сборку, если это зачем-то понадобится.
[env]
FXT_GEMM_X86_MULTI = "1"
FXTRANSLATE_REQUIRE_SIMD = "1"
