# Rexon build aliases.
#
# WHY. `Cargo.toml` has `default-members = ["rexon-core"]` —
# on purpose, so that a bare `cargo test` of the core does not drag Qt6 along
# (rexon-gui, rexon-qt-filter on cxx-qt).
# The price is a trap: a bare `cargo build --release` reports
# «Finished» within seconds, having built ONE core, while the `rexon-main-window` window with
# the QML tabs stays old. A person
# is sure they built today's state but measures the one from the day before yesterday. We stepped
# on this on 2026-08-29: «the build succeeded», a .so two days old.
# A measurement after editing a tab's source: `cargo build --release` — «Finished
# in 0.05s», the .so untouched; `cargo build-app` — 1 min 45 s, the .so fresh.
#
# The trap is removed not by dropping `default-members` (the core would lose its
# independence from Qt) but with named commands: each has its own
# honest set of packages, and none builds less than it promises.
# The list is visible without reading this file — `cargo --list` prints the aliases
# together with their expansion.
#
# ⚠️ Aliases are read from the CURRENT directory, not from `--manifest-path`:
# they work when cargo is run from `rust/` or from inside a crate. From the
# repository root (`cargo build --manifest-path rust/Cargo.toml`) cargo will not see
# this file — there the package set is written with `-p` by hand.
#
# There is no Python bridge anymore: rexon-py went to the archive (_archived/, 02.10.2026).

[alias]
# The whole application: the core + `rexon-main-window` (the QML tabs) +
# `librexon_qt_filter.so` (the filter editor model). This is what the
# live Rexon loads, and what must be fresh before ANY UI measurement.
# Requires Qt6. The «build the project» command is this one, NOT a bare `cargo build`.
build-app = "build --release -p rexon-core -p rexon-gui -p rexon-qt-filter"

# The same in debug — for debug runs of the tabs. ⚠️ release and debug live
# in different target directories: build debug — and release stays old.
build-app-debug = "build -p rexon-core -p rexon-gui -p rexon-qt-filter"

# The login splash binary. As a SEPARATE command, and that is not carelessness:
# rexon-splash-overlay pulls in its own stack (wayland/EGL), and when it gets into
# ONE cargo run together with rexon-gui, the feature unification of shared dependencies
# (libc, rustix, bitflags, log…) changes — rexon-gui is rebuilt
# entirely. Measured: alternating «everything in one run» and `build-app` burned
# 1 min 40 s each out of nothing. In separate runs — 0.1 s, each command's feature set
# is stable. The splash is edited rarely, the tabs every day.
build-splash = "build --release -p rexon-splash-overlay"

# Core tests: an explicit name for what a bare `cargo test` does — without Qt and without
# Python. For this independence default-members was narrowed down to rexon-core.
test-core = "test -p rexon-core"

# The same without the checks that need a LIVE machine (the live PATH, `lrelease`,
# the git object database): they are marked `#[cfg_attr(feature = "isolated-checks",
# ignore = "…")]` and libtest will print them on a separate «ignored» line with
# the reason instead of silently counting them green. Why exactly a build feature —
# see `rexon-core/Cargo.toml`, the `[features]` section.
# ⚠️ Switching the feature rebuilds the set of checks (a different cfg) — that is minutes,
# not seconds; for ordinary work `test-core` is what you need.
test-core-isolated = "test -p rexon-core --features isolated-checks"

# ── Building the translation engine: four kernels in one file, chosen by CPUID ──
#
# WHY. The vendored `fxtranslate` (rust/vendor/fxtranslate/) can build
# its matrix multiplication kernel FOR SEVERAL instruction sets at once —
# avx2, avxvnni, avx512bw, avx512vnni — and choose the set once on
# first use by the processor flags (`is_x86_feature_detected!`). This is
# our edit, upstream does not have it: in 0.4.2 the set is nailed down AT BUILD TIME
# (`-mavx2` in their build.rs) and there is no CPUID check anywhere.
#
# WHAT FORGETTING IT RISKS. A kernel built for one set gives SIGILL on a processor
# without it, and not at start: the stand measurement — «model load:
# 0.031 s», the window already shown, and exit code 132 = 128 + 4 on the FIRST
# matrix multiplication. So a buyer with an old processor (Intel before
# Haswell, AMD before Zen, low-end Celeron/Pentium/Atom) will see the program
# crash on the first description translation. That is why the variable lives here, in
# the workspace config, and not in the memory of the person who builds.
#
# THE PRICE. Four copies of the kernel in one file — 10–20 KB (0.90 against 0.89 MB):
# the kernel is compact template code, the whole model lives in an external file.
# The multi-arch build runs exactly like a dedicated VNNI build (0.071 against
# 0.069 s per paragraph — noise). `-C target-cpu=native` is deliberately not set: it
# would tie the build to the developer's machine, and the gain was already taken by its
# activation rounding edit in the vendor.
#
# REQUIRE_SIMD. The second nail: without it, if building the shim fails, the crate
# SILENTLY falls back to the scalar kernel — that is 9 times slower, and the swap
# can only be noticed by measuring. Better that the build honestly stops.
#
# ⚠️ Read from the CURRENT directory, like the aliases above: it works from
# `rust/` and from inside the crates. When building from the repository root
# (`--manifest-path rust/Cargo.toml`), both variables must be set by hand —
# otherwise you get a single-arch build for AVX2.
# ⚠️ The multi-arch branch requires GNU binutils (`objcopy --localize-hidden`,
# `ar`) and is written for x86-64; aarch64 goes the former single-arch way
# (i8mm), MSVC is not supported.
# The environment takes priority (force is not set): `FXT_GEMM_X86_MULTI=0 cargo …`
# brings back the single-arch build if that is ever needed.
[env]
FXT_GEMM_X86_MULTI = "1"
FXTRANSLATE_REQUIRE_SIMD = "1"
